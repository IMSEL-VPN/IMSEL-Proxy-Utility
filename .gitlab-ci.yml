# GitLab Pages: сборка только проверенных публичных страниц.
# Сайт публикуется на gitlab-docs.imsel.dev (Settings -> Pages -> New Domain).
variables:
  GIT_DEPTH: "0"

default:
  before_script:
    - apk add --no-cache git

pages:
  stage: deploy
  image: python:3.12-alpine
  variables:
    MKDOCS_MATERIAL_VERSION: "9.7.7"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - pip install --no-cache-dir mkdocs-material==$MKDOCS_MATERIAL_VERSION
    - python scripts/validate-docs.py
    - python scripts/history_guard.py
    - python -m unittest discover -s tests -v
    - python scripts/build-docs.py
  artifacts:
    paths:
      - public

validate-docs:
  stage: test
  image: python:3.12-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"'
  script:
    - python scripts/validate-docs.py
    - python scripts/history_guard.py
    - python -m unittest discover -s tests -v
