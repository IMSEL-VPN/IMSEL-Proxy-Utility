# GitHub Pages: сборка Material for MkDocs на git-docs.imsel.dev.
# Требует публичный репозиторий и Settings -> Pages -> Source: GitHub Actions.
name: Deploy docs to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  MKDOCS_MATERIAL_VERSION: "9.7.7"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mkdocs-material==$MKDOCS_MATERIAL_VERSION
      - run: python scripts/validate-docs.py
      - run: python scripts/history_guard.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build-docs.py
      - run: echo "git-docs.imsel.dev" > public/CNAME
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
